version: '3'
services:
  medallion:
    build:
      context: .
      dockerfile: docker_utils/Dockerfile
    command: [sh, -c, "medallion --host 0.0.0.0"]
    environment:
      MEDALLION_BACKEND_MODULE_CLASS: "PostgresBackend"
      MEDALLION_BACKEND_POSTGRES_URI: "postgresql://user:password@postgres:5432/medallion"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medallion
    ports:
      - "5432:5432"
